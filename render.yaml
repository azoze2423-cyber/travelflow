services:
  - type: web
    name: travelflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "720"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@travelflow.ae
      - key: ADMIN_PASSWORD
        sync: false
      - key: AGENCY_NAME
        value: TravelFlow Agency
      - key: CURRENCY
        value: AED
      - key: SEED_DEMO
        value: "false"
